name: Review isolated staging admin export policies
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-staging-export-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify dummy customer privacy and read-only administrator access
        run: python tests/test_staging_admin_export_readonly.py
