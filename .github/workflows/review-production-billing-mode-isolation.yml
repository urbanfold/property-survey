name: Review production billing mode isolation
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/billing.mjs'
      - 'tests/test_production_billing_mode_isolation.mjs'
      - '.github/workflows/review-production-billing-mode-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  billing-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test_production_billing_mode_isolation.mjs
