name: Verify and publish survey app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check application JavaScript
        run: node --input-type=module --check < app.js
      - name: Test recovery and failure handling
        run: python tests/test_survey_flow.py
      - name: Test real browser client, private photos, and exports
        run: python tests/test_browser_integration.py
      - name: Test database policies with isolated PostgreSQL
        run: python tests/test_database_policies.py

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Package only website files
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site/vendor
          cp index.html app.js _site/
          cp vendor/*.js vendor/README.md _site/vendor/
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path('_site/index.html')
          path.write_text(path.read_text().replace('stabilisation-1', os.environ['BUILD_SHA'][:12]))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
