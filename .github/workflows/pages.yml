name: Verify and publish survey app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check application JavaScript
        run: node --input-type=module --check < app.js
      - name: Check saved-survey PDF export
        run: node --test tests/test_saved_survey_pdf.mjs
      - name: Check branded client report inside ZIP
        run: node --test tests/test_branded_survey_pack.mjs
      - name: Test sign-out privacy and stale account dashboard protection
        run: node --test tests/test_logout_privacy.mjs
      - name: Test deliberate logout in isolated Chromium browser
        run: python tests/test_logout_privacy_browser.py
      - name: Test unexpected session expiry and same-user recovery in isolated Chromium
        run: python tests/test_unexpected_session_recovery_browser.py
      - name: Test late private photo callbacks respect signed-out sessions
        run: node --test tests/test_signed_photo_session.mjs
      - name: Test late survey response is ignored after logout
        run: python tests/test_logout_async_race_browser.py
      - name: Test different-account and cross-tab signout privacy
        run: python tests/test_session_account_switch_browser.py
      - name: Check secure survey notification cutover
        run: node --test tests/test_notification_cutover.mjs
      - name: Check dashboard payment deployment files
        run: python scripts/build_dashboard_functions.py --check
      - name: Test payment validation and Stripe signatures
        run: node --test tests/test_billing_handlers.mjs
      - name: Test recovery and failure handling
        run: python tests/test_survey_flow.py
      - name: Test real browser client, private photos, and exports
        run: python tests/test_browser_integration.py
      - name: Test administrator read-only customer survey screen in isolated Chromium
        run: python tests/test_admin_readonly_browser.py
      - name: Test client allowance and review on mobile
        run: python tests/test_client_allowance.py
      - name: Test Leica room entry, measurement validation, and safe cleanup
        run: python tests/test_leica_connection.py
      - name: Test database policies with isolated PostgreSQL
        run: python tests/test_database_policies.py
      - name: Test survey purchase enforcement with isolated PostgreSQL
        run: python tests/test_survey_purchases.py

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      actions: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Package only website files
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site/vendor
          cp index.html app.js stripe-test-account-check.html staging-buyer-checkout.html admin-account-review-live.html _site/
          cp vendor/*.js vendor/README.md _site/vendor/
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path
          import os
          path = Path('_site/index.html')
          path.write_text(path.read_text().replace('stabilisation-1', os.environ['BUILD_SHA'][:12]))
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            count=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq .total_count) || count=0
            if [ "$count" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact metadata did not become available"
          exit 1
      - name: Publish verified website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
