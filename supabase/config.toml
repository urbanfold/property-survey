# Checkout validates the user's bearer token through Supabase Auth itself.
# Stripe cannot supply a Supabase JWT: its endpoint verifies Stripe's signature.
[functions.create-survey-checkout]
verify_jwt = false

[functions.stripe-survey-webhook]
verify_jwt = false

# Proposed F02 gateway validates Auth itself; do not deploy without approval.
[functions.request-survey-notification]
verify_jwt = false

# Candidate server-only endpoints; receiver must be deployed to staging only.
[functions.staging-notification-receiver]
verify_jwt = false

[functions.dispatch-registration-notifications]
verify_jwt = false
